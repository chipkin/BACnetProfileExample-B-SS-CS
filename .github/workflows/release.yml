# Build, smoke-test and Wire-Test the B-SS C# example, and publish a GitHub Release (the
# runnable app for windows-x64 and linux-x64, without the CAS BACnet Stack library, plus
# README, LICENSE and metrics.json) when a vX.Y.Z tag is pushed. PRs run the same build and
# tests without publishing.
#
# Unlike the C++/Node siblings, this build has TWO stages: (1) build the native CAS BACnet
# Stack shared library from the stack submodule's C++ source (MSBuild's ReleaseDll|x64
# configuration on Windows, g++ -shared on Linux - see README.md "Build the native CAS
# BACnet Stack library"), then (2) `dotnet build -c Release` this project and copy that
# native library next to its output so the P/Invoke adapter can find it at run time. The
# C# adapter is compiled in place from submodules/cas-bacnet-stack/adapters/csharp/.
#
# THE STACK LIBRARY IS NEVER PACKAGED. The CAS BACnet Stack is a separate, commercially
# licensed product: CI builds its library only to test this example. A release ships the
# app (a self-contained single-file `dotnet publish`) but never CASBACnetStack_x64_Release.dll
# / libCASBACnetStack_x64_Release.so or any other CASBACnetStack* file, so the released app
# cannot start until a licensed user puts the library next to it; without it, the app prints
# a clear error and exits 1 (checked below). A licensed user builds the library from the
# submodule (README.md). The Package and release steps fail if a stack binary gets in.
#
# The CAS BACnet Stack is a PRIVATE git submodule: the repository secret CAS_STACK_PAT must
# hold a PAT with read access to chipkin/cas-bacnet-stack.
name: build-and-release

on:
  pull_request:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 pins the VS 2022 (v143) toolset the stack's ReleaseDll config
          # (and the released binaries) are built with.
          - os: windows-2022
            artifact: BACnetProfileExampleBSSCS-windows-x64
            outdir: bin/Release/net8.0
            exe: BACnetProfileExampleBSSCS.exe
            rid: win-x64
            nativelib: CASBACnetStack_x64_Release.dll
            metrics: metrics-windows.json
          - os: ubuntu-latest
            artifact: BACnetProfileExampleBSSCS-linux-x64
            outdir: bin/Release/net8.0
            exe: BACnetProfileExampleBSSCS
            rid: linux-x64
            nativelib: libCASBACnetStack_x64_Release.so
            metrics: metrics-linux.json
    steps:
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout (with the CAS BACnet Stack submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CAS_STACK_PAT || github.token }}

      - name: Stack commit (recorded in metrics.json)
        id: stack
        shell: bash
        run: echo "sha=$(git -C submodules/cas-bacnet-stack rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build the native CAS BACnet Stack library (Windows - MSBuild ReleaseDll|x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild submodules\cas-bacnet-stack\projects\msvs\BuildCASBACnetStack.sln `
            /p:Configuration=ReleaseDll /p:Platform=x64 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed with exit code $LASTEXITCODE" }
          Get-ChildItem submodules\cas-bacnet-stack\bin\CASBACnetStack_x64_Release.dll

      - name: Build the native CAS BACnet Stack library (Linux - g++ shared)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p submodules/cas-bacnet-stack/bin
          g++ -shared -fPIC -std=c++17 -O2 \
              -I submodules/cas-bacnet-stack/source \
              submodules/cas-bacnet-stack/source/*.cpp \
              -o submodules/cas-bacnet-stack/bin/libCASBACnetStack_x64_Release.so
          ls -la submodules/cas-bacnet-stack/bin/libCASBACnetStack_x64_Release.so

      - name: dotnet build (Release)
        shell: bash
        run: dotnet build -c Release

      - name: Copy the native library next to the .NET output
        shell: bash
        run: cp "submodules/cas-bacnet-stack/bin/${{ matrix.nativelib }}" "${{ matrix.outdir }}/${{ matrix.nativelib }}"

      - name: Smoke test + metrics (starts, binds, stays up; measures time to 'ready')
        shell: bash
        run: |
          cd "${{ matrix.outdir }}"
          start=$(date +%s%3N)
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./"${{ matrix.exe }}" --port 47822 > smoke.log 2>&1 &
          else
            ./"${{ matrix.exe }}" --port 47822 > smoke.log 2>&1 &
          fi
          PID=$!
          ready_ms=""
          for i in $(seq 1 100); do
            if grep -q "ready" smoke.log; then ready_ms=$(( $(date +%s%3N) - start )); break; fi
            sleep 0.1
          done
          sleep 2
          if kill -0 "$PID" 2>/dev/null; then kill "$PID" 2>/dev/null || true; else echo "FAIL: device exited early"; cat smoke.log; exit 1; fi
          [ -n "$ready_ms" ] || { echo "FAIL: no 'ready' line"; cat smoke.log; exit 1; }
          cat smoke.log
          cd - > /dev/null
          bytes=$(stat -c %s "${{ matrix.outdir }}/${{ matrix.exe }}" 2>/dev/null || wc -c < "${{ matrix.outdir }}/${{ matrix.exe }}")
          sha=$(sha256sum "${{ matrix.outdir }}/${{ matrix.exe }}" | cut -c1-16)
          stackver=$(grep -oE 'CAS BACnet Stack v[0-9.]+' "${{ matrix.outdir }}/smoke.log" | head -1 | grep -oE '[0-9.]+' || true)
          appver=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' "${{ matrix.outdir }}/smoke.log" | head -1 || true)
          cat > "${{ matrix.metrics }}" <<EOF
          {
            "example": "BACnetProfileExampleBSSCS",
            "app_version": "$appver",
            "os": "${{ matrix.os }}",
            "link_mode": "PInvoke-DLL",
            "stack_commit": "${{ steps.stack.outputs.sha }}",
            "stack_version": "$stackver",
            "binary_bytes": $bytes,
            "binary_sha256_prefix": "$sha",
            "startup_ms_to_ready": $ready_ms,
            "dotnet_version": "$(dotnet --version)",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "git_ref": "${{ github.ref_name }}"
          }
          EOF
          cat "${{ matrix.metrics }}"
          { echo '### metrics (${{ matrix.os }})'; echo '```json'; cat "${{ matrix.metrics }}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The Wire Tests: a Python client (the Peer) discovers the sensor, reads it following
      # the sensor Simulation, and drives its Failure Modes (tests/README.md). Python 3
      # standard library only.
      - name: Wire Tests
        if: runner.os == 'Linux'
        shell: bash
        run: python3 tests/run_wire_tests.py --port 47821

      # The released app: a self-contained single-file publish (no .NET install needed). The
      # .csproj never copies the stack library into a publish folder (CopyToPublishDirectory
      # Never), and the guard below makes sure of it.
      - name: Publish the app (without the CAS BACnet Stack library)
        shell: bash
        run: |
          dotnet publish -c Release -r "${{ matrix.rid }}" --self-contained true \
              -p:PublishSingleFile=true -o publish
          ls -la publish

      - name: Guard - no CAS BACnet Stack binary in the published app
        shell: bash
        run: |
          if find publish -type f | grep -iE '(^|/)[^/]*casbacnetstack[^/]*$|\.node$'; then
            echo "FAIL: a CAS BACnet Stack binary is in the published app"; exit 1
          fi

      # What a user who downloads the release sees: without the licensed library the app
      # must print the missing-library message and exit 1 - never crash.
      - name: The published app without the library prints the error and exits 1
        shell: bash
        run: |
          set +e
          ./publish/"${{ matrix.exe }}" --port 47823 > missing.out 2> missing.err < /dev/null
          code=$?
          set -e
          cat missing.err
          [ "$code" -eq 1 ] || { echo "FAIL: exit code $code, expected 1"; cat missing.out; exit 1; }
          head -1 missing.err | tr -d '\r' | grep -qxF "ERROR: This example cannot run without the CAS BACnet Stack library." \
              || { echo "FAIL: the first stderr line is not the missing-library message"; exit 1; }
          ./publish/"${{ matrix.exe }}" --version

      - name: Package (the app, README, LICENSE, metrics - never the stack library)
        shell: bash
        run: |
          mkdir -p dist package
          cp publish/* package/
          cp README.md LICENSE package/
          cp "${{ matrix.metrics }}" dist/
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd package && 7z a -tzip "../dist/${{ matrix.artifact }}.zip" .)
          else
            (cd package && zip -r "../dist/${{ matrix.artifact }}.zip" .)
          fi
          # README.md and LICENSE also ship once as plain assets, from the Linux build: the
          # Windows checkout converts them to CRLF, so the two copies would differ byte for
          # byte and the release job's one-copy-per-name check would refuse them.
          if [ "$RUNNER_OS" = "Linux" ]; then
            cp README.md LICENSE dist/
          fi
          # The CAS BACnet Stack is never redistributed: refuse to upload any stack binary.
          if find dist package -type f | grep -iE '(^|/)[^/]*casbacnetstack[^/]*$|\.node$'; then
            echo "FAIL: a CAS BACnet Stack binary is in dist/"; exit 1
          fi
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # Every platform artifact could carry a file of the same name. Uploading two assets
      # with one name makes the release action fail part-way and leaves a draft release
      # behind (a real tagged release hit this). Flatten the artifacts into one folder with
      # a single copy of each file name, and stop if two files share a name but differ.
      # Then refuse to publish if a CAS BACnet Stack binary got through.
      - name: Collect release assets (one copy of each file name)
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f | sort | while read -r f; do
            name=$(basename "$f")
            if [ -e "release/$name" ]; then
              cmp -s "$f" "release/$name" || { echo "FAIL: two different files are both named $name ($f)"; exit 1; }
            else
              cp "$f" "release/$name"
            fi
          done
          # Look inside the app zips too.
          if { find release -type f; for z in release/*.zip; do unzip -Z1 "$z"; done; } \
              | grep -iE '(^|/)[^/]*casbacnetstack[^/]*$|\.node$'; then
            echo "FAIL: a CAS BACnet Stack binary is in the release assets"; exit 1
          fi
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
